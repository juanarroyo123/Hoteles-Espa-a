name: Actualizar Hoteles en Venta

on:
  # Desactivado a peticion de Juan (29/09/2026): el scraper de hoteles lo
  # sigue lanzando el manualmente desde su terminal cada dia. Se deja SOLO
  # el disparo manual (workflow_dispatch) por si algun dia quiere lanzarlo
  # desde GitHub sin tocar el cron de nuevo.
  # schedule:
  #   - cron: '0 6,12,18,0 * * *'   # 4 veces al dia: 6h, 12h, 18h, 0h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45           # corta si se cuelga

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ── Node.js: lo usa cruzar_licencias.js (cruce automático anuncio↔
      # licencia turística oficial, corre dentro de scraper.py en cada
      # scrapeo) ───────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -- Chrome estable: se instala el .deb suelto directamente en vez de
      # gestionar la llave GPG del repositorio (el metodo con
      # "curl | gpg --dearmor" se rompio tras la actualizacion de imagen de
      # GitHub Actions del 19/09 -- gpg intenta abrir /dev/tty y no existe en
      # el runner). Mismo metodo que ya usa enrich_precios_paralelo.yml. ----
      - name: Instalar Chrome estable
        run: |
          curl -fsSL -o /tmp/google-chrome-stable.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -q
          sudo apt-get install -y /tmp/google-chrome-stable.deb
          google-chrome --version          # imprime version para debug

      # ── Dependencias Python ──────────────────────────────────────────────
      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml \
                      selenium webdriver-manager \
                      undetected-chromedriver

      # ── Scraper ──────────────────────────────────────────────────────────
      - name: Ejecutar scraper
        env:
          GITHUB_ACTIONS: 'true'
          PYTHONUNBUFFERED: '1'
        run: python scraper.py

      # ── Commit ───────────────────────────────────────────────────────────
      - name: Commit y push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html hoteles_cache.json offmarket_cache.json
          git diff --staged --quiet || \
            git commit -m "🏨 Actualización $(date +'%d/%m/%Y %H:%M UTC') — $(python -c 'import json; d=json.load(open(\"hoteles_cache.json\")); print(len(d),\"anuncios\")')"
          git push
