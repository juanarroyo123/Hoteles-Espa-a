name: Actualizar ADR Hoteles

on:
  schedule:
    - cron: '0 2 * * *'   # cada día a las 2h UTC (sin interferir con scrape.yml)
  workflow_dispatch:        # también se puede lanzar a mano desde GitHub

permissions:
  contents: write

jobs:
  enrich-adr:
    runs-on: ubuntu-latest
    timeout-minutes: 340    # 5h40min — máximo seguro antes del límite de 6h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -- Chrome estable: se instala el .deb suelto directamente en vez de
      # gestionar la llave GPG del repositorio (el metodo con
      # "curl | gpg --dearmor" se rompio tras la actualizacion de imagen de
      # GitHub Actions del 19/09 -- gpg intenta abrir /dev/tty y no existe en
      # el runner). Mismo metodo que ya usa enrich_precios_paralelo.yml. ----
      - name: Instalar Chrome
        run: |
          curl -fsSL -o /tmp/google-chrome-stable.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -q
          sudo apt-get install -y /tmp/google-chrome-stable.deb
          google-chrome --version

      # ── Dependencias Python ──────────────────────────────────────────────
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install undetected-chromedriver beautifulsoup4 lxml httpx[http2]

      # ── Scraper ADR ──────────────────────────────────────────────────────
      - name: Ejecutar enrich_registry
        env:
          GITHUB_ACTIONS: 'true'
          PYTHONUNBUFFERED: '1'
        run: |
          python enrich_registry.py \
            --input licencias.json.gz \
            --limit 5000 \
            --workers 3 \
            --fast \
            --headless

      # -- Commit resultado -------------------------------------------------
      # El scrape tarda hasta 5h40, tiempo de sobra para que main se mueva
      # (publicaciones off-market, otros commits...). Antes de empujar, se
      # trae lo ultimo y se reordena el commit encima; si eso deja marcadores
      # de conflicto de verdad (muy improbable, un solo fichero propio), se
      # para sin forzar nada, en vez de tirar 5 horas de trabajo a la basura.
      - name: Commit y push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          COUNT=$(python -c "import json; print(len(json.load(open('registro_enriquecido.json'))))")
          git add registro_enriquecido.json
          git diff --staged --quiet || \
            git commit -m "ADR actualizado $(date +'%d/%m/%Y %H:%M UTC') -- ${COUNT} hoteles"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
            if grep -q '^<<<<<<<' registro_enriquecido.json; then
              echo 'Conflicto real al fusionar, no se sube automaticamente. Revisar a mano.'
              exit 1
            fi
          fi
          git push origin main
